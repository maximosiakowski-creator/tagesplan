<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Tagesplan</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tagesplan">

<link rel="stylesheet" href="style.css">
</head>
<body data-mode="normal">
<div class="wrap">

  <div class="nav">
    <div class="eyebrow" style="font-size:13px;font-weight:600;color:var(--secondary);text-transform:uppercase" id="dateLine"></div>
  </div>

  <div class="daynav">
    <button class="chev" id="prevBtn" onclick="shiftDay(-1)">‹</button>
    <div class="daylabel">
      <div class="d1" id="selDayName"></div>
      <div class="d2" id="selDayDate"></div>
    </div>
    <button class="chev" id="nextBtn" onclick="shiftDay(1)">›</button>
  </div>
  <div id="planBanner"></div>

  <div class="seg">
    <button id="mNormal" onclick="setMode('normal')">Normale Woche</button>
    <button id="mBau" onclick="setMode('baustelle')">Baustellenwoche</button>
  </div>

  <div class="summary">
    <div class="stat statmain" id="dutyStat">
      <div class="k" id="dutyLabel">Pflichten heute</div>
      <div class="v"><span id="dutyCount">0/3</span></div>
      <div class="progressbar"><div class="fillbar" id="dutyBar" style="width:0%"></div></div>
    </div>
    <div class="stat statrow">
      <div class="k">Streak</div>
      <div class="sv"><span id="streak">0</span> <span class="unit" id="streakUnit">Tage</span></div>
    </div>
  </div>

  <div id="carry"></div>

  <div class="history">
    <div class="k">Letzte 14 Werktage</div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="sechead" id="planHead">Dein Tag</div>
  <div id="blocks"></div>

  <div class="footer">
    Wecker im Handy: 09:45 · 13:15 · 18:45<br>
    Nicht verhandelbar. Kette nicht reißen lassen.
    <div class="footeractions">
      <button class="footerbtn" onclick="exportData()">Sichern</button><span class="footersep"> · </span><button class="footerbtn" onclick="triggerImport()">Wiederherstellen</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
